<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accelerating Image Spinner</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #10131b;
      color: #f3f5fb;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(680px, 100%);
      text-align: center;
    }

    h1 { margin: 0 0 8px; font-size: clamp(1.6rem, 4vw, 2.4rem); }
    p { color: #aeb7ca; margin: 0 0 24px; }

    #dropZone {
      min-height: 170px;
      display: grid;
      place-items: center;
      padding: 24px;
      border: 2px dashed #59657e;
      border-radius: 18px;
      background: #181d29;
      cursor: pointer;
      transition: border-color .2s, background .2s, transform .2s;
    }

    #dropZone:hover, #dropZone.dragging {
      border-color: #7c9cff;
      background: #202941;
      transform: translateY(-2px);
    }

    #fileInput { display: none; }
    .hint { color: #d9e0ef; font-weight: 600; }
    .subhint { display: block; color: #8792aa; font-size: .9rem; margin-top: 6px; }

    #stage {
      min-height: 360px;
      margin-top: 22px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 18px;
      background:
        linear-gradient(45deg, #242a38 25%, transparent 25%),
        linear-gradient(-45deg, #242a38 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #242a38 75%),
        linear-gradient(-45deg, transparent 75%, #242a38 75%);
      background-size: 28px 28px;
      background-position: 0 0, 0 14px, 14px -14px, -14px 0;
      background-color: #1b202c;
    }

    #preview {
      display: none;
      max-width: min(80vw, 520px);
      max-height: 330px;
      object-fit: contain;
      transform-origin: center;
      user-select: none;
      pointer-events: none;
    }

    #emptyMessage { color: #77839b; }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 52px;
      color: #aeb7ca;
      font-size: .95rem;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 9px 16px;
      color: white;
      background: #536fd4;
      cursor: pointer;
      font: inherit;
    }

    button:hover { background: #6683e9; }
    button:disabled { opacity: .45; cursor: not-allowed; }
  </style>
</head>
<body>
  <main>
    <h1>Accelerating Image Spinner</h1>
    <p>Choose an image or drag it into the box. Rotation begins automatically.</p>
    <p>Credit to: amway</p>

    <label id="dropZone" for="fileInput">
      <span>
        <span class="hint">Click to choose an image, or drop one here</span>
        <span class="subhint">PNG, JPG, GIF, WebP, and other browser-supported formats</span>
      </span>
      <input id="fileInput" type="file" accept="image/*">
    </label>

    <section id="stage" aria-label="Image preview">
      <span id="emptyMessage">Your image will appear here</span>
      <canvas id="preview" aria-label="Uploaded image"></canvas>
    </section>

    <div class="controls">
      <button id="toggleButton" type="button" disabled>Pause</button>
      <span id="speedLabel">Speed: 0°/s</span>
    </div>
  </main>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const preview = document.getElementById('preview');
    const emptyMessage = document.getElementById('emptyMessage');
    const toggleButton = document.getElementById('toggleButton');
    const speedLabel = document.getElementById('speedLabel');

    let objectUrl = null;
    let sourceImage = null;
    let averageCanvas = null;
    let animationId = null;
    let lastTime = 0;
    let angle = 0;
    let angularSpeed = 0; // degrees per second
    let averageBlend = 0;
    let paused = false;

    // The image reaches 720 degrees per second after three seconds,
    // then continues accelerating.
    const acceleration = 720 / 3; // 240 degrees per second squared
    const averageThreshold = 720;
    const averageFullThreshold = 3600;
    const averageSamples = 64;

    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) loadImage(fileInput.files[0]);
    });

    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, event => {
        event.preventDefault();
        dropZone.classList.add('dragging');
      });
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, event => {
        event.preventDefault();
        dropZone.classList.remove('dragging');
      });
    });

    dropZone.addEventListener('drop', event => {
      const file = [...event.dataTransfer.files].find(item => item.type.startsWith('image/'));
      if (file) loadImage(file);
    });

    toggleButton.addEventListener('click', () => {
      paused = !paused;
      toggleButton.textContent = paused ? 'Resume' : 'Pause';
      if (!paused) {
        lastTime = performance.now();
        animationId = requestAnimationFrame(animate);
      }
    });

    function loadImage(file) {
      if (!file.type.startsWith('image/')) return;

      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(file);
      sourceImage = new Image();
      sourceImage.onload = () => {
        prepareCanvases();
        buildRotationalAverage();
        lastTime = performance.now();
        cancelAnimationFrame(animationId);
        animationId = requestAnimationFrame(animate);
      };
      sourceImage.src = objectUrl;
      preview.style.display = 'block';
      emptyMessage.style.display = 'none';
      toggleButton.disabled = false;
      paused = false;
      toggleButton.textContent = 'Pause';
      angle = 0;
      angularSpeed = 0;
      averageBlend = 0;
      lastTime = performance.now();
      cancelAnimationFrame(animationId);
    }

    function prepareCanvases() {
      const scale = Math.min(1, 600 / Math.max(sourceImage.naturalWidth, sourceImage.naturalHeight));
      preview.width = Math.max(1, Math.round(sourceImage.naturalWidth * scale));
      preview.height = Math.max(1, Math.round(sourceImage.naturalHeight * scale));

      const sourceCanvas = document.createElement('canvas');
      sourceCanvas.width = preview.width;
      sourceCanvas.height = preview.height;
      sourceCanvas.getContext('2d').drawImage(sourceImage, 0, 0, preview.width, preview.height);
      sourceImage = sourceCanvas;
    }

    function buildRotationalAverage() {
      const width = preview.width;
      const height = preview.height;
      const source = sourceImage.getContext('2d').getImageData(0, 0, width, height).data;
      const result = document.createElement('canvas');
      result.width = width;
      result.height = height;
      const output = result.getContext('2d').createImageData(width, height);
      const centerX = (width - 1) / 2;
      const centerY = (height - 1) / 2;

      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const dx = x - centerX;
          const dy = y - centerY;
          const radius = Math.hypot(dx, dy);
          const baseAngle = Math.atan2(dy, dx);
          let red = 0, green = 0, blue = 0, alpha = 0;

          for (let sample = 0; sample < averageSamples; sample++) {
            const theta = baseAngle + sample * Math.PI * 2 / averageSamples;
            const sampleX = Math.max(0, Math.min(width - 1,
              Math.round(centerX + Math.cos(theta) * radius)));
            const sampleY = Math.max(0, Math.min(height - 1,
              Math.round(centerY + Math.sin(theta) * radius)));
            const sourceIndex = (sampleY * width + sampleX) * 4;
            red += source[sourceIndex];
            green += source[sourceIndex + 1];
            blue += source[sourceIndex + 2];
            alpha += source[sourceIndex + 3];
          }

          const outputIndex = (y * width + x) * 4;
          output.data[outputIndex] = red / averageSamples;
          output.data[outputIndex + 1] = green / averageSamples;
          output.data[outputIndex + 2] = blue / averageSamples;
          output.data[outputIndex + 3] = alpha / averageSamples;
        }
      }

      result.getContext('2d').putImageData(output, 0, 0);
      averageCanvas = result;
    }

    function animate(now) {
      if (paused) return;

      const seconds = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;
      angularSpeed += acceleration * seconds;
      angle = (angle + angularSpeed * seconds) % 360;
      if (angularSpeed > averageThreshold) {
        averageBlend = Math.min(1, Math.max(0,
          (angularSpeed - averageThreshold) /
          (averageFullThreshold - averageThreshold)));
      }

      const context = preview.getContext('2d');
      context.clearRect(0, 0, preview.width, preview.height);
      context.save();
      context.translate(preview.width / 2, preview.height / 2);
      context.rotate(angle * Math.PI / 180);
      context.drawImage(sourceImage, -preview.width / 2, -preview.height / 2);
      context.restore();

      if (averageCanvas && averageBlend > 0) {
        context.globalAlpha = averageBlend;
        context.drawImage(averageCanvas, 0, 0);
        context.globalAlpha = 1;
      }
      speedLabel.textContent = `Speed: ${Math.round(angularSpeed)}°/s`;
      animationId = requestAnimationFrame(animate);
    }
  </script>
</body>
</html>
